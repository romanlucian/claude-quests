<!doctype html><body><script>
// Pixel-art frames of the cat for terminals without pictures (VS Code): the
// head of assets/cat/source.png, scaled down, snapped to his colours, cleaned
// of lone pixels and outlined; then the frames, as terminal cells.
const W = 28, H = 28
const PAL = [[10,10,10],[90,50,20],[226,140,30],[248,181,27],[252,206,90],[236,227,211],[40,110,200],[20,40,90],[242,106,33],[60,60,75]]
const CROP = { x: 110, y: 20, w: 680, h: 680 }

function downscale(img) {
  let c = document.createElement('canvas'); c.width = CROP.w; c.height = CROP.h
  c.getContext('2d').drawImage(img, CROP.x, CROP.y, CROP.w, CROP.h, 0, 0, CROP.w, CROP.h)
  while (c.width / 2 > W * 2) {
    const n = document.createElement('canvas'); n.width = Math.round(c.width / 2); n.height = Math.round(c.height / 2)
    const x = n.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(c, 0, 0, n.width, n.height); c = n
  }
  const o = document.createElement('canvas'); o.width = W; o.height = H
  const x = o.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(c, 0, 0, W, H)
  return x.getImageData(0, 0, W, H).data
}

// Pixels as [r, g, b] or null (clear).
function pixelArt(img) {
  const d = downscale(img), px = []
  const near = (r, g, b) => PAL.reduce((best, p) => { const e = (p[0]-r)**2*0.3 + (p[1]-g)**2*0.59 + (p[2]-b)**2*0.11; return e < best[0] ? [e, p] : best }, [1e9, PAL[0]])[1]
  for (let i = 0; i < W * H; i++) px.push(d[i*4+3] >= 110 ? near(d[i*4], d[i*4+1], d[i*4+2]) : null)
  const key = p => p === null ? 'x' : p.join(',')
  const keep = p => p[2] > p[0] + 40 || p[0] + p[1] + p[2] < 100 // blue (eyes) and black stay
  for (let pass = 0; pass < 2; pass++) {
    const src = px.slice()
    for (let j = 1; j < H - 1; j++) for (let i = 1; i < W - 1; i++) {
      const n = j * W + i, p = src[n]
      if (p === null || keep(p)) continue
      const around = [n-1, n+1, n-W, n+W, n-W-1, n-W+1, n+W-1, n+W+1].map(m => src[m])
      if (around.slice(0, 4).some(q => key(q) === key(p))) continue
      const count = {}
      for (const q of around) if (q !== null) count[key(q)] = (count[key(q)] || 0) + 1
      const best = Object.entries(count).sort((a, b) => b[1] - a[1])[0]
      if (best === undefined || best[1] < 4) continue
      const c = best[0].split(',').map(Number)
      if (!keep(c)) px[n] = c
    }
  }
  // Only the cat: drop pieces that are not joined to him (the tip of his tail).
  const seen = new Int32Array(W * H).fill(-1), sizes = []
  for (let n0 = 0; n0 < W * H; n0++) {
    if (px[n0] === null || seen[n0] >= 0) continue
    const id = sizes.length, stack = [n0]; seen[n0] = id; let size = 0
    while (stack.length) { const n = stack.pop(); size++; const i = n % W
      for (const m of [i > 0 ? n - 1 : -1, i < W - 1 ? n + 1 : -1, n - W, n + W]) if (m >= 0 && m < W * H && px[m] !== null && seen[m] < 0) { seen[m] = id; stack.push(m) } }
    sizes.push(size)
  }
  const biggest = sizes.indexOf(Math.max(...sizes))
  for (let n = 0; n < W * H; n++) if (px[n] !== null && seen[n] !== biggest) px[n] = null
  const outline = []
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const n = j * W + i
    if (px[n] !== null) continue
    if ((i > 0 && px[n-1]) || (i < W-1 && px[n+1]) || (j > 0 && px[n-W]) || (j < H-1 && px[n+W])) outline.push(n)
  }
  for (const n of outline) px[n] = [10, 10, 10]
  return px
}

// The mouth, at his mouth in the source: (470, 551).
const MX = Math.round((470 - CROP.x) / CROP.w * W), MY = Math.round((551 - CROP.y) / CROP.h * H)
const DARK = [59, 15, 18], TONGUE = [232, 115, 127], STAR = [248, 181, 27], RED = [238, 66, 55]
function frame(base, { shift = 0, mouth = 0, stars = false }) {
  const px = new Array(W * H).fill(null)
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) { const from = j - shift; if (from >= 0 && from < H) px[j * W + i] = base[from * W + i] }
  const set = (i, j, c) => { j += shift; if (i >= 0 && i < W && j >= 0 && j < H) px[j * W + i] = c }
  if (mouth >= 1) { set(MX - 1, MY, DARK); set(MX, MY, DARK) }
  if (mouth >= 2) { set(MX - 1, MY + 1, TONGUE); set(MX, MY + 1, TONGUE); set(MX - 2, MY, DARK); set(MX + 1, MY, DARK) }
  if (stars) for (const [i, j, c] of [[1, 3, STAR], [2, 2, STAR], [0, 2, STAR], [1, 1, STAR], [26, 1, RED], [26, 3, RED], [25, 2, RED], [27, 2, RED], [24, 9, STAR]]) px[j * W + i] = c
  return px
}

// Two pixels a cell: ▀ with the top as its color and the bottom behind it.
function cells(px) {
  const DEFAULT = 0x01000000, words = new Uint32Array(W * (H / 2) * 3)
  const rgb = p => (p[0] << 16) | (p[1] << 8) | p[2]
  for (let r = 0; r < H / 2; r++) for (let i = 0; i < W; i++) {
    const top = px[(r * 2) * W + i], bottom = px[(r * 2 + 1) * W + i], k = (r * W + i) * 3
    if (top === null && bottom === null) words.set([0x20, DEFAULT, DEFAULT], k)
    else if (top === null) words.set([0x2584, rgb(bottom), DEFAULT], k)
    else words.set([0x2580, rgb(top), bottom === null ? DEFAULT : rgb(bottom)], k)
  }
  let s = ''; const bytes = new Uint8Array(words.buffer)
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i])
  return btoa(s)
}

function preview(px, scale = 8) {
  const c = document.createElement('canvas'); c.width = W * scale; c.height = H * scale; const x = c.getContext('2d')
  for (let n = 0; n < W * H; n++) if (px[n]) { x.fillStyle = `rgb(${px[n].join(',')})`; x.fillRect((n % W) * scale, Math.floor(n / W) * scale, scale, scale) }
  return c.toDataURL('image/png')
}

window.build = async src => {
  const img = new Image(); await new Promise(r => { img.onload = r; img.src = src })
  const base = pixelArt(img)
  const FRAMES = { idle: {}, breathe: { shift: 1 }, talk1: { mouth: 1 }, talk2: { mouth: 2 }, cheer: { shift: -1, mouth: 2, stars: true }, cheer2: { mouth: 1, stars: true } }
  const out = {}
  for (const [name, o] of Object.entries(FRAMES)) { const px = frame(base, o); out[name] = { cells: cells(px), preview: preview(px) } }
  return { columns: W, rows: H / 2, frames: out }
}
</script></body>
